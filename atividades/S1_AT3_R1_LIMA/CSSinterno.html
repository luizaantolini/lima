<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página com estilos CSS internos">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_interno</title>
    <style>
        body {
            color: rgb(135, 187, 255);
            background-color: rgb(6, 0, 176);
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
        h1 {
            color: rgb(178, 144, 250);
            background-color: rgb(112, 7, 193);
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
        p {
            color: rgb(255, 255, 255);
            background-color: rgba(199, 1, 120, 0.904);
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>CSS Interno</h1>
    <p>Este é um exemplo de CSS interno.</p>
</body>
</html>
